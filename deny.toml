# cargo-deny: licenses, advisories, duplicate crates and crate sources.

[graph]
# Lint the dependency graph of every platform we ship, not only the host.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, not vulnerable. Only askama's template proc-macro uses it,
    # at compile time, to read an optional config file this project lacks.
    # Revisit when askama replaces it.
    { id = "RUSTSEC-2026-0374", reason = "compile-time only, via askama_derive" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is set up ahead of dependencies; unused entries are expected.
unused-allowed-license = "allow"
# Permissive licenses only; extend deliberately when a dependency needs it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Our own crates are `publish = false` and need no license audit.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version and are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
