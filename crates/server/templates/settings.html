{% extends "base.html" %}

{% block content %}
<div class="page-head">
  <div>
    <h1>Настройки</h1>
  </div>
</div>

<div class="columns">
  <section class="card">
    <div class="card-head">
      <div>
        <h2>Календарь</h2>
        <p>По этому часовому поясу считаются окна и сутки на всех компьютерах, независимо от их собственных часов.</p>
      </div>
    </div>
    <form method="post" action="/settings/calendar" class="form-stack">
      <label class="field">
        <span>Часовой пояс</span>
        <input name="time_zone" value="{{ time_zone }}" required spellcheck="false">
        <small>Идентификатор вроде Europe/Moscow.</small>
      </label>
      <label class="field">
        <span>Начало суток</span>
        <input type="time" name="day_start" value="{{ day_start }}" required>
        <small>В это время квота обнуляется. Обычно ночью, когда ребёнок спит.</small>
      </label>
      <div><button type="submit" class="button primary">Сохранить</button></div>
    </form>
  </section>

  <section class="card">
    <div class="card-head">
      <div>
        <h2>Пароль</h2>
        <p>После смены пароля все входы, в том числе этот, завершатся.</p>
      </div>
    </div>
    <form method="post" action="/settings/password" class="form-stack">
      <label class="field"><span>Текущий пароль</span><input type="password" name="current" autocomplete="current-password" required></label>
      <label class="field"><span>Новый пароль</span><input type="password" name="new" autocomplete="new-password" minlength="8" required><small>Не короче 8 символов.</small></label>
      <label class="field"><span>Повторите новый пароль</span><input type="password" name="repeat" autocomplete="new-password" minlength="8" required></label>
      <div><button type="submit">Сменить пароль</button></div>
    </form>
  </section>
</div>
{% endblock %}
