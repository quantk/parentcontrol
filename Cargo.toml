[workspace]
resolver = "3"
members = ["crates/core", "crates/agent", "crates/tray", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Every dependency is declared here once, with the reason it is needed, and
# crates opt in with `.workspace = true`.
[workspace.dependencies]
parentcontrol-core = { path = "crates/core" }

# Errors: typed in libraries, `anyhow` only at binary entry points.
anyhow = "1.0.104"
thiserror = "2.0.21"
# Time zones and civil dates for budget days; bundled tzdb so static
# binaries and minimal containers behave the same everywhere.
jiff = { version = "0.2.43", features = ["serde", "tzdb-bundle-always"] }
# Snapshot, journal and protocol serialization.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Unique ids of usage records for idempotent merging.
uuid = { version = "1.29.2", features = ["serde"] }
# Custom rules: path globs and command-line regular expressions.
glob = "0.3.4"
regex = "1.13.1"
# Async runtime for the agent's scan loop and server connection.
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal"] }
# Structured logs (journald / service log via stderr).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Command-line interface of the binaries.
clap = { version = "4.6.7", features = ["derive"] }
# Linux signals without hand-written FFI.
rustix = { version = "1.1.6", features = ["process"] }

# Test-only.
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
# `deny` rather than `forbid`: `platform/` modules opt back in with
# `#[allow(unsafe_code)]`, and `forbid` cannot be overridden.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints that back the code-quality rules in PLAN.md section 6.
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
