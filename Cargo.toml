[workspace]
resolver = "3"
members = ["crates/core", "crates/agent", "crates/tray", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

# Every dependency is declared here once, with the reason it is needed, and
# crates opt in with `.workspace = true`.
[workspace.dependencies]
parentcontrol-core = { path = "crates/core" }

# Errors: typed in libraries, `anyhow` only at binary entry points.
anyhow = "1.0.104"
thiserror = "2.0.21"
# Time zones and civil dates for budget days; bundled tzdb so static
# binaries and minimal containers behave the same everywhere.
jiff = { version = "0.2.43", features = ["serde", "tzdb-bundle-always"] }
# Snapshot, journal and protocol serialization.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Unique ids of usage records for idempotent merging.
uuid = { version = "1.29.2", features = ["serde"] }
# Custom rules: path globs and command-line regular expressions.
glob = "0.3.4"
regex = "1.13.1"
# Async runtime: the agent's scan loop and connection, the server.
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "sync", "net", "io-util"] }
# Agent–server WebSocket over TLS with a pinned server certificate.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
# Certificate fingerprints and token hashes.
sha2 = "0.11.1"
# Random tokens and enrollment codes.
getrandom = "0.4.3"
# Structured logs (journald / service log via stderr).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Command-line interface of the binaries.
clap = { version = "4.6.7", features = ["derive"] }
# Server: HTTP and WebSocket routing, TLS serving, self-signed certificate.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "form", "query"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
rcgen = "0.14.10"
# Query strings of panel redirects (already used by axum for forms).
serde_urlencoded = "0.7.1"
# Server storage.
rusqlite = { version = "0.42.0", features = ["bundled"] }
# Parent password hashing, and reading it without echo on the server.
argon2 = "0.6.0"
rpassword = "7"
# Panel templates compiled into the binary; no frontend build step.
askama = "0.16.1"
# Windows: the service control manager, and the raw API for processes,
# accounts, ACLs and the registry.
windows-service = "0.8.1"
windows-sys = "0.61.2"
# Tray on Linux: StatusNotifierItem, and notifications over the same D-Bus.
ksni = "0.3.7"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
# Linux signals without hand-written FFI.
rustix = { version = "1.1.6", features = ["process"] }

# Stream and sink combinators for the agent's WebSocket.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

# Test-only.
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace.lints.rust]
# `deny` rather than `forbid`: `platform/` modules opt back in with
# `#[allow(unsafe_code)]`, and `forbid` cannot be overridden.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints that keep panics, unwraps and unchecked unsafe out of the code.
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
