[workspace]
resolver = "3"
members = ["crates/core", "crates/agent", "crates/tray", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
parentcontrol-core = { path = "crates/core" }

[workspace.lints.rust]
# `deny` rather than `forbid`: `platform/` modules opt back in with
# `#[allow(unsafe_code)]`, and `forbid` cannot be overridden.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints that back the code-quality rules in PLAN.md section 6.
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
